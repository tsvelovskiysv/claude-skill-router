[project]
name = "claude-skill-router"
version = "0.1.0"
description = "Semantic router for Claude Code / Agent Skills — finds and installs the right skills for your project from a 65k catalog."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tsvelovskiysv" }]
keywords = ["claude", "claude-code", "agent-skills", "skills", "semantic-search", "router"]
dependencies = [
    "numpy>=1.24",
    "fastembed>=0.3",
]

[project.urls]
Homepage = "https://github.com/tsvelovskiysv/claude-skill-router"
Issues = "https://github.com/tsvelovskiysv/claude-skill-router/issues"

[project.scripts]
skill-router = "skill_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_router"]
